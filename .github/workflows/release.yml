name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Bump version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          npm version $NEW_VERSION --no-git-tag-version
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package.json
          git commit -m "chore(release): v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin main --tags

  build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm run docs

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        run: pnpm package:windows

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifact/opengate-linux-x64
          cp -r apps/server/dist artifact/opengate-linux-x64/apps/server/dist
          cp -r apps/web/dist artifact/opengate-linux-x64/apps/web/dist
          cp -r packages/*/dist artifact/opengate-linux-x64/packages/
          cp -r docs artifact/opengate-linux-x64/docs
          cp README.md artifact/opengate-linux-x64/README.md
          cp package.json artifact/opengate-linux-x64/package.json
          cp pnpm-lock.yaml artifact/opengate-linux-x64/pnpm-lock.yaml
          cp -r packages/db/src/migrations artifact/opengate-linux-x64/migrations
          cat > artifact/opengate-linux-x64/start.sh << 'EOF'
          #!/bin/bash
          # Start OpenGate on Linux
          pnpm install --prod
          node apps/server/dist/index.js
          EOF
          chmod +x artifact/opengate-linux-x64/start.sh
          cd artifact && tar -czf ../opengate-linux-x64.tar.gz opengate-linux-x64 && cd ..

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: opengate-windows-x64
          path: opengate-windows-x64.zip

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: opengate-linux-x64
          path: opengate-linux-x64.tar.gz

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: opengate-windows-x64
          path: dist-windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: opengate-linux-x64
          path: dist-linux

      - name: Rename artifacts with version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mv dist-windows/opengate-windows-x64.zip "dist-windows/opengate-windows-x64-${VERSION}.zip"
          mv dist-linux/opengate-linux-x64.tar.gz "dist-linux/opengate-linux-x64-${VERSION}.tar.gz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist-windows/*.zip
            dist-linux/*.tar.gz
          generate_release_notes: true
