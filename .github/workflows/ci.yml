name: CI / CD Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-document:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        id: pnpm-cache
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build
        run: pnpm run build

      - name: Generate Documentation
        run: pnpm run docs

      # Étape clé : Sauvegarde de la documentation technique générée + les specs d'architecture
      - name: Upload Documentation Raw Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opengate-docs-raw
          path: |
            specs/
            docs/
          if-no-files-found: ignore

      - name: Run Packaging Script (Windows)
        run: node scripts/package-windows.js

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opengate-windows-binary
          path: opengate-windows-x64.zip

  release:
    needs: build-and-document
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Détermination d'une version unique basée sur le nombre de commits
      - name: Generate Version Number
        id: version
        shell: bash
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "version=0.1.0.${BUILD_NUMBER}" >> $GITHUB_OUTPUT

      - name: Download Windows Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: opengate-windows-binary

      - name: Download Docs Artifact
        uses: actions/download-artifact@v4
        with:
          name: opengate-docs-raw
          path: temp-docs

      - name: Prepare assets
        shell: bash
        id: assets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p final-assets
          
          # Renommer le zip Windows avec le tag de la CI
          if [ -f opengate-windows-x64.zip ]; then
            mv opengate-windows-x64.zip "final-assets/opengate-windows-x64-v${VERSION}.zip"
          fi
          
          # Compression du dossier complet de documentation avec 7z (natif sur GitHub Windows)
          cd temp-docs
          7z a "../final-assets/opengate-docs-v${VERSION}.zip" ./*
          cd ..
          
          echo "tag_name=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.assets.outputs.tag_name }}
          name: Release ${{ steps.assets.outputs.tag_name }}
          body: |
            Automated production build for OpenGate.
            
            ### Artifacts inclus :
            * `opengate-windows-x64-v${{ steps.version.outputs.version }}.zip` : Application compilée (avec fallback autonome).
            * `opengate-docs-v${{ steps.version.outputs.version }}.zip` : Spécifications techniques d'architecture, ADRs et schémas générés.
          draft: false
          prerelease: false
          files: |
            final-assets/opengate-windows-x64-v${{ steps.version.outputs.version }}.zip
            final-assets/opengate-docs-v${{ steps.version.outputs.version }}.zip
