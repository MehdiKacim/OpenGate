name: CI and Release

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm run docs

      # Étape Doc : On sauvegarde le dossier généré par tes scripts (OpenAPI / DB Docs)
      - uses: actions/upload-artifact@v4
        with:
          name: opengate-docs-raw
          path: docs/

  package-windows:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      
      # Exécute ton script de packaging (génère opengate-windows-x64.zip à la racine)
      - run: pnpm package:windows

      # On uploade le zip généré directement par ton script
      - uses: actions/upload-artifact@v4
        with:
          name: opengate-windows-zip
          path: opengate-windows-x64.zip

  release:
    needs: [build-and-test, package-windows]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version")
          echo "version=${BASE}.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      # On télécharge le zip de l'application Windows
      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: opengate-windows-zip
          path: .

      # On télécharge les artefacts bruts de la doc
      - name: Download Docs
        uses: actions/download-artifact@v4
        with:
          name: opengate-docs-raw
          path: temp-docs

      # On renomme l'application et on compresse proprement la doc
      - name: Prepare assets
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p final-assets
          
          # Renommer le zip Windows avec la version de la CI
          mv opengate-windows-x64.zip "final-assets/opengate-windows-x64-v${VERSION}.zip"
          
          # Zipper le dossier complet de la documentation
          cd temp-docs
          zip -r "../final-assets/opengate-docs-v${VERSION}.zip" ./*
          cd ..

      # Publication finale des deux archives ZIP sur GitHub Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: |
            final-assets/*.zip
          generate_release_notes: true
