Name: CI and Release

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm run docs

      # On sauvegarde le dossier de la doc générée. 
      # Si tes scripts créent un dossier 'docs/', on prend tout son contenu.
      - uses: actions/upload-artifact@v4
        with:
          name: opengate-docs
          path: docs/

  package-windows:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      
      # Lance ton script de packaging qui appelle @yao-pkg/pkg
      - run: pnpm package:windows

      # On utilise une recherche récursive (**/*.exe) pour trouver l'exécutable,
      # qu'il soit à la racine ou planqué dans 'apps/server/dist/'
      - uses: actions/upload-artifact@v4
        with:
          name: opengate-windows-binary
          path: "**/*.exe"

  release:
    needs: [build-and-test, package-windows]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version")
          echo "version=${BASE}.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      # On récupère le binaire extrait au job précédent
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: opengate-windows-binary
          path: release-artifacts

      # On récupère la doc
      - name: Download Docs
        uses: actions/download-artifact@v4
        with:
          name: opengate-docs
          path: temp-docs

      # On prépare les fichiers pour la release
      - name: Prepare assets
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # On va dans le dossier où se trouvent les .exe (parfois imbriqués à cause du pattern **)
          # et on les rassemble proprement à la racine de release-artifacts en les renommant
          mkdir -p final-assets
          find release-artifacts -name "*.exe" -exec cp {} final-assets/ \;
          
          cd final-assets
          for f in *.exe; do
            [ -e "$f" ] || continue
            mv "$f" "${f%.exe}-v${VERSION}.exe"
          done
          cd ..

          # On compresse le dossier de la doc en un fichier zip nommé avec la version
          cd temp-docs
          zip -r "../final-assets/opengate-docs-v${VERSION}.zip" ./*
          cd ..

      # Publication sur GitHub Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: |
            final-assets/*.exe
            final-assets/*.zip
          generate_release_notes: true
