name: CI and Release

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm run docs

      - uses: actions/upload-artifact@v4
        with:
          name: opengate-docs
          path: docs/

  package-windows:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm package:windows

      - uses: actions/upload-artifact@v4
        with:
          name: opengate-windows-binary
          path: "**/*.exe"

  release:
    needs: [build-and-test, package-windows]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version")
          echo "version=${BASE}.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: opengate-windows-binary
          path: release-artifacts

      - name: Download Docs
        uses: actions/download-artifact@v4
        with:
          name: opengate-docs
          path: temp-docs

      - name: Prepare assets
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          mkdir -p final-assets
          find release-artifacts -name "*.exe" -exec cp {} final-assets/ \;
          
          cd final-assets
          for f in *.exe; do
            [ -e "$f" ] || continue
            mv "$f" "${f%.exe}-v${VERSION}.exe"
          done
          cd ..

          cd temp-docs
          zip -r "../final-assets/opengate-docs-v${VERSION}.zip" ./*
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: |
            final-assets/*.exe
            final-assets/*.zip
          generate_release_notes: true
